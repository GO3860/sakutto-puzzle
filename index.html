<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サクッとパズル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5eddf;color:#4b2b19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{text-align:center;padding:24px 12px 12px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.03em}
.sub{margin-top:5px;font-size:17px;font-weight:700;color:#765d48}
.wrap{width:94vw;max-width:560px;margin:auto}
.board{
 position:relative;margin:10px auto 0;padding:18px;width:100%;aspect-ratio:1;
 border-radius:28px;background:linear-gradient(145deg,#d6a064,#a86e3d);
 box-shadow:0 12px 0 #704625,0 22px 35px #0003,inset 0 2px #f4d09b;
}
.frame{position:relative;width:100%;height:100%;border-radius:19px;background:#9a693f;padding:8px;box-shadow:inset 0 0 14px #0006}
.target{position:absolute;inset:8px;border-radius:14px;background:#c6aa83;box-shadow:inset 0 0 15px #0005;overflow:hidden}
.target svg{width:100%;height:100%;opacity:.28}
.piece{position:absolute;width:50%;height:50%;touch-action:none;z-index:5;filter:drop-shadow(0 7px 5px #0005);cursor:grab}
.piece.drag{cursor:grabbing;filter:drop-shadow(0 12px 9px #0006);z-index:30}
.piece.locked{z-index:8;filter:drop-shadow(0 2px 2px #0004)}
.piece svg{width:100%;height:100%;display:block;overflow:visible}
.status{text-align:center;font-weight:900;font-size:18px;min-height:30px;margin:25px 0 10px}
.controls{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
button{border:0;border-radius:26px;padding:14px 25px;font-size:17px;font-weight:900;color:white;background:#2d88d8;box-shadow:0 6px #1d5d96}
button:active{transform:translateY(4px);box-shadow:0 2px #1d5d96}
button.alt{background:#f2a21b;box-shadow:0 6px #bd7510}
.note{text-align:center;color:#8a735e;font-size:14px;line-height:1.5;margin:0 18px 30px}
</style>
</head>
<body>
<header>
<h1>🧩 サクッとパズル</h1>
<div class="sub">ピースを動かして絵を完成させよう</div>
</header>

<div class="wrap">
<div class="board">
 <div class="frame">
  <div class="target" id="target"></div>
 </div>
</div>
<div class="status" id="status">ピースをつかんで動かしてみよう</div>
<div class="controls">
 <button class="alt" id="reset">↻ リセット</button>
 <button id="sound">🔊 音あり</button>
</div>
<p class="note">近づくと少し重くなり、最後に「サクッ」と吸い込まれます。</p>
</div>

<script>
const scene = `
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#59b8eb"/><stop offset="1" stop-color="#bfe9fa"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#75ad4f"/><stop offset="1" stop-color="#4f873d"/></linearGradient>
 <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="2" result="n"/><feBlend in="SourceGraphic" in2="n" mode="soft-light"/></filter>
</defs>
<rect width="400" height="400" fill="url(#sky)"/>
<g fill="#fff" opacity=".9">
 <path d="M55 88c-18 0-21-24-4-29 6-16 31-15 36 2 20-3 25 27 5 27z"/>
 <path d="M285 58c-14 0-17-18-3-22 5-12 23-12 27 1 15-2 19 21 4 21z"/>
</g>
<path d="M0 218 Q85 180 170 218 T340 207 T400 215 V300 H0Z" fill="url(#grass)"/>
<path d="M0 260 Q90 238 180 263 T400 252 V400 H0Z" fill="#79a94c"/>
<g stroke="#684a38" stroke-width="7">
 <path d="M0 316H400"/><path d="M0 337H400"/>
</g>
<g stroke="#e4d5b8" stroke-width="7">
 <path d="M10 325H390"/><path d="M10 346H390"/>
</g>
<g fill="#8b694f">
 <path d="M25 309v42M60 309v42M95 309v42M130 309v42M165 309v42M200 309v42M235 309v42M270 309v42M305 309v42M340 309v42M375 309v42"/>
</g>
<!-- shinkansen -->
<path d="M18 300 Q38 275 84 257 L190 222 Q214 214 250 222 L330 247 Q355 255 377 276 L393 292 V321 H18Z" fill="#f7f5ee" stroke="#a7b5c1" stroke-width="3"/>
<path d="M18 300 Q38 275 84 257 L110 247 L82 286 Q62 306 18 310Z" fill="#edf2f4"/>
<path d="M82 286 Q100 260 128 246 L191 226 L209 239 L165 264 L129 288Z" fill="#1765a4"/>
<path d="M128 288 L385 288 L393 303 H115Z" fill="#d9e1e5"/>
<path d="M115 286 H390 V300 H112Z" fill="#1d6fae"/>
<g fill="#2674aa">
 <rect x="226" y="244" width="25" height="19" rx="4"/><rect x="264" y="246" width="25" height="19" rx="4"/><rect x="302" y="249" width="25" height="19" rx="4"/><rect x="340" y="254" width="22" height="17" rx="4"/>
</g>
<path d="M18 321 H393" stroke="#6c7780" stroke-width="6"/>
<path d="M0 358 Q100 345 200 360 T400 354 V400 H0Z" fill="#4f8e3f"/>
</svg>`;

const target=document.getElementById('target');
target.innerHTML=scene;

const pieces=[];
const starts=[[-15,-18],[57,-10],[-20,58],[58,55]];
let placed=0,soundOn=true;

function pieceSVG(i){
 const x=(i%2)*200, y=Math.floor(i/2)*200;
 const clipId='clip'+i;
 // Each piece is a true puzzle silhouette: the inner edge uses a tab/slot.
 const paths=[
  `M0 0H78 C78 28 122 28 122 0 H200 V78 C172 78 172 122 200 122 V200 H122 C122 172 78 172 78 200 H0 V122 C28 122 28 78 0 78Z`,
  `M0 0H78 C78 28 122 28 122 0 H200 V78 C172 78 172 122 200 122 V200 H122 C122 172 78 172 78 200 H0 V122 C28 122 28 78 0 78Z`,
  `M0 0H78 C78 28 122 28 122 0 H200 V78 C172 78 172 122 200 122 V200 H122 C122 172 78 172 78 200 H0 V122 C28 122 28 78 0 78Z`,
  `M0 0H78 C78 28 122 28 122 0 H200 V78 C172 78 172 122 200 122 V200 H122 C122 172 78 172 78 200 H0 V122 C28 122 28 78 0 78Z`
 ][i];
 return `<svg viewBox="0 0 200 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
 <defs><clipPath id="${clipId}"><path d="${paths}"/></clipPath></defs>
 <g clip-path="url(#${clipId})">
   <svg x="${-x}" y="${-y}" width="400" height="400" viewBox="0 0 400 400">${scene.replace('<svg viewBox="0 0 400 400"','<svg viewBox="0 0 400 400"')}</svg>
 </g>
 <path d="${paths}" fill="none" stroke="#c18a52" stroke-width="6" stroke-linejoin="round"/>
 <path d="${paths}" fill="none" stroke="#f5d59e" stroke-width="2" opacity=".9"/>
 </svg>`;
}

function makePiece(i){
 const p=document.createElement('div');
 p.className='piece';p.dataset.i=i;p.innerHTML=pieceSVG(i);
 p.style.left=starts[i][0]+'%';p.style.top=starts[i][1]+'%';
 document.querySelector('.board').appendChild(p);pieces.push(p);

 let sx=0,sy=0,baseL=0,baseT=0;
 p.addEventListener('pointerdown',e=>{
   if(p.classList.contains('locked'))return;
   p.setPointerCapture(e.pointerId);p.classList.add('drag');
   sx=e.clientX;sy=e.clientY;baseL=parseFloat(p.style.left);baseT=parseFloat(p.style.top);
 });
 p.addEventListener('pointermove',e=>{
   if(!p.classList.contains('drag'))return;
   const br=document.querySelector('.board').getBoundingClientRect();
   const dx=(e.clientX-sx)/br.width*100,dy=(e.clientY-sy)/br.height*100;
   let nl=baseL+dx,nt=baseT+dy;
   const tx=6+(i%2)*50,ty=6+Math.floor(i/2)*50;
   const dist=Math.hypot(nl-tx,nt-ty);
   if(dist<14){nl=baseL+dx*.55;nt=baseT+dy*.55;document.getElementById('status').textContent='……もう少し。';}
   p.style.left=nl+'%';p.style.top=nt+'%';
   if(dist<4.5)snap(p,tx,ty);
 });
 p.addEventListener('pointerup',()=>p.classList.remove('drag'));
}

function snap(p,x,y){
 if(p.classList.contains('locked'))return;
 p.style.left=x+'%';p.style.top=y+'%';p.classList.remove('drag');p.classList.add('locked');
 placed++;vibrate();beep();
 document.getElementById('status').textContent=placed===4?'🎉 完成！ サクッ！':'🧩 サクッ！';
}
function vibrate(){if(navigator.vibrate)navigator.vibrate([10,18,28]);}
function beep(){
 if(!soundOn)return;
 try{
  const a=new(window.AudioContext||window.webkitAudioContext)();
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';
  o.frequency.setValueAtTime(180,a.currentTime);o.frequency.exponentialRampToValueAtTime(85,a.currentTime+.09);
  g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.008);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);
  o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.13);
 }catch(e){}
}
function reset(){
 pieces.forEach(p=>p.remove());pieces.length=0;placed=0;
 for(let i=0;i<4;i++)makePiece(i);
 document.getElementById('status').textContent='ピースをつかんで動かしてみよう';
}
document.getElementById('reset').onclick=reset;
document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音あり':'🔇 音なし'};
reset();
</script>
</body>
</html>
