<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>サクッとパズル｜厚紙版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eee7d9;color:#3d3024;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
body{text-align:center;padding:18px 10px 35px;user-select:none;-webkit-user-select:none}
h1{font-size:30px;margin:12px 0 4px;font-weight:900;letter-spacing:.04em}.sub{font-size:16px;margin:0 0 16px;color:#665748}
#board{position:relative;width:min(92vw,520px);aspect-ratio:1.08;margin:0 auto 16px;background:linear-gradient(#9ed3f0 0 55%,#83b965 55%);border:12px solid #b58c59;border-radius:22px;box-shadow:0 10px 0 #876640,0 18px 28px #0002;overflow:hidden;touch-action:none}
.target{position:absolute;width:44%;height:44%;border:3px dashed #fff9;border-radius:15px;background:#ffffff18;box-shadow:inset 0 0 0 2px #ffffff22}
.t1{left:3%;top:3%}.t2{right:3%;top:3%}.t3{left:3%;bottom:3%}.t4{right:3%;bottom:3%}
.piece{position:absolute;width:44%;height:44%;border:5px solid #f8e6b5;border-radius:17px;background:#f1d99b;box-shadow:0 7px 0 #805d3d,0 12px 16px #0003;z-index:5;touch-action:none;overflow:visible;transition:box-shadow .12s,filter .12s}
.piece:before,.piece:after,.knobL,.knobB{content:"";position:absolute;background:#f1d99b;border:5px solid #f8e6b5;border-radius:50%;z-index:-1}
.piece:before{width:31px;height:31px;top:-19px;left:50%;transform:translateX(-50%)}.piece:after{width:31px;height:31px;right:-19px;top:50%;transform:translateY(-50%)}
.knobL{width:31px;height:31px;left:-19px;top:50%;transform:translateY(-50%)}.knobB{width:31px;height:31px;bottom:-19px;left:50%;transform:translateX(-50%)}
.art{position:absolute;inset:0;overflow:hidden;border-radius:11px}.sky{position:absolute;inset:0 0 45%;background:linear-gradient(#8ed0f1,#c7e8f8)}
.hill{position:absolute;left:-10%;right:-10%;bottom:35%;height:28%;background:#6faa58;border-radius:50% 50% 0 0}
.track{position:absolute;left:-10%;right:-10%;bottom:8%;height:12%;background:repeating-linear-gradient(0deg,#6b594b 0 7px,#c4a37d 7px 12px)}
.train{position:absolute;left:10%;bottom:18%;font-size:52px;filter:drop-shadow(3px 5px 2px #0004)}.label{position:absolute;bottom:3%;left:0;right:0;font-size:10px;font-weight:900;letter-spacing:.08em;color:#684c2c}
#p1{left:7%;top:7%}#p2{right:7%;top:7%}#p3{left:7%;bottom:7%}#p4{right:7%;bottom:7%}
#p1 .train{left:8%;bottom:15%}#p2 .train{left:30%;bottom:20%}#p3 .train{left:-8%;bottom:16%}#p4 .train{left:38%;bottom:19%}
.drag{filter:brightness(1.04);box-shadow:0 3px 0 #805d3d,0 7px 12px #0004;z-index:20}.locked{filter:saturate(1.05)}
#message{font-size:24px;font-weight:900;min-height:36px;margin:4px 0}#hint{font-size:14px;color:#756556;margin:3px 0 15px}
button{border:0;background:#2f86d8;color:#fff;font-weight:900;font-size:18px;border-radius:999px;padding:13px 28px;box-shadow:0 5px 0 #1d5d98}button:active{transform:translateY(4px);box-shadow:0 1px 0 #1d5d98}
.flash{animation:flash .22s ease-out}@keyframes flash{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
</style>
</head>
<body>
<h1>🧩 サクッとパズル</h1><p class="sub">厚紙の「抵抗 → スッ → サクッ」を試そう</p>
<div id="board">
<div class="target t1"></div><div class="target t2"></div><div class="target t3"></div><div class="target t4"></div>
<div class="piece" id="p1" data-x="3" data-y="3"><div class="art"><div class="sky"></div><div class="hill"></div><div class="track"></div><div class="train">🚄</div><div class="label">MEOW TRAIN</div></div><span class="knobL"></span><span class="knobB"></span></div>
<div class="piece" id="p2" data-x="53" data-y="3"><div class="art"><div class="sky"></div><div class="hill"></div><div class="track"></div><div class="train">🚄</div><div class="label">MEOW TRAIN</div></div><span class="knobL"></span><span class="knobB"></span></div>
<div class="piece" id="p3" data-x="3" data-y="53"><div class="art"><div class="sky"></div><div class="hill"></div><div class="track"></div><div class="train">🚄</div><div class="label">MEOW TRAIN</div></div><span class="knobL"></span><span class="knobB"></span></div>
<div class="piece" id="p4" data-x="53" data-y="53"><div class="art"><div class="sky"></div><div class="hill"></div><div class="track"></div><div class="train">🚄</div><div class="label">MEOW TRAIN</div></div><span class="knobL"></span><span class="knobB"></span></div>
</div>
<div id="message">ピースをつかんで動かしてみよう</div><div id="hint">近づくと少し重くなり、最後に「サクッ」とはまります</div><button id="reset">もう一度</button>
<script>
const board=document.getElementById('board'),msg=document.getElementById('message'),reset=document.getElementById('reset'),pieces=[...document.querySelectorAll('.piece')];let audioCtx=null,active=null;
function sound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(190,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(78,audioCtx.currentTime+.075);g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.16,audioCtx.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.10);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.11)}catch(e){}}
function buzz(){if(navigator.vibrate)navigator.vibrate([12,18,28])}
function targets(){const b=board.getBoundingClientRect();return pieces.map(p=>({x:parseFloat(p.dataset.x)/100*b.width+b.left+p.offsetWidth/2,y:parseFloat(p.dataset.y)/100*b.height+b.top+p.offsetHeight/2}))}
pieces.forEach((p,i)=>{
p.dataset.locked='0';
p.addEventListener('pointerdown',e=>{if(p.dataset.locked==='1')return;e.preventDefault();sound();active={p,i,sx:e.clientX,sy:e.clientY,left:p.offsetLeft,top:p.offsetTop};p.classList.add('drag');p.setPointerCapture?.(e.pointerId)});
p.addEventListener('pointermove',e=>{if(!active||active.p!==p)return;e.preventDefault();const b=board.getBoundingClientRect();let nx=active.left+e.clientX-active.sx,ny=active.top+e.clientY-active.sy;nx=Math.max(-18,Math.min(b.width-p.offsetWidth+18,nx));ny=Math.max(-18,Math.min(b.height-p.offsetHeight+18,ny));const t=targets()[i],cx=b.left+nx+p.offsetWidth/2,cy=b.top+ny+p.offsetHeight/2,d=Math.hypot(cx-t.x,cy-t.y);if(d<95){const f=.62+(d/95)*.38;nx=active.left+(e.clientX-active.sx)*f;ny=active.top+(e.clientY-active.sy)*f;msg.textContent='🟨 少し重くなってきた…'}else msg.textContent='ピースを動かしてみよう';p.style.left=nx+'px';p.style.top=ny+'px'});
p.addEventListener('pointerup',()=>{if(!active||active.p!==p)return;const b=board.getBoundingClientRect(),t=targets()[i],r=p.getBoundingClientRect(),d=Math.hypot(r.left+r.width/2-t.x,r.top+r.height/2-t.y);if(d<58){p.style.left=parseFloat(p.dataset.x)/100*b.width+'px';p.style.top=parseFloat(p.dataset.y)/100*b.height+'px';p.dataset.locked='1';p.classList.remove('drag');p.classList.add('locked','flash');sound();buzz();msg.textContent='✨ サクッ！';setTimeout(()=>p.classList.remove('flash'),250);if(pieces.every(x=>x.dataset.locked==='1'))msg.textContent='🎉 サクッ！完成！'}else{p.classList.remove('drag');msg.textContent='もう少し近づけてみよう'}active=null});
p.addEventListener('pointercancel',()=>{if(active?.p===p){p.classList.remove('drag');active=null}});
});
reset.addEventListener('click',()=>location.reload());
</script>
</body></html>
