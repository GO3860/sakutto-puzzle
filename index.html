<title>サクッとパズル｜2ピース</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#f5eddf;color:#4b2b19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:18px 10px 8px}
h1{margin:0;font-size:34px;font-weight:900}
.sub{margin-top:5px;font-size:17px;font-weight:700;color:#765d48}
.boardWrap{display:flex;justify-content:center;padding-top:10px}
.board{position:relative;width:min(86vw,430px);aspect-ratio:2/1;padding:14px;border-radius:24px;background:linear-gradient(145deg,#d4a064,#a86e3d);box-shadow:0 9px #704625,0 16px 28px #0003,inset 0 2px #f4d09b}
.inner{position:absolute;inset:14px;border-radius:16px;background:#c5aa83;box-shadow:inset 0 0 13px #0006;overflow:hidden}
.inner svg{width:100%;height:100%;opacity:.12}
.centerHint{position:absolute;top:8%;bottom:8%;left:50%;border-left:2px dashed #fff8;opacity:.7}
.tray{display:flex;justify-content:center;gap:18px;margin-top:32px}
.piece{width:min(39vw,180px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 8px 5px #0005);z-index:5}
.piece.drag{z-index:50;filter:drop-shadow(0 14px 9px #0006)}
.piece.locked{filter:drop-shadow(0 2px 2px #0004)}
.piece svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.status{text-align:center;font-weight:900;font-size:18px;margin:24px 0 12px;height:28px}
.controls{display:flex;justify-content:center;gap:12px}
button{border:0;border-radius:25px;padding:12px 24px;font-size:16px;font-weight:900;color:white;background:#2d88d8;box-shadow:0 5px #1d5d96}
button.alt{background:#f2a21b;box-shadow:0 5px #bd7510}
.note{text-align:center;color:#8a735e;font-size:13px;margin:8px 18px}
@media(max-height:720px){
 header{padding-top:6px}.board{width:min(82vw,400px)}.tray{margin-top:16px}.piece{width:min(35vw,150px)}.note{display:none}
}

<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
let soundOn = true, locked = [false,false];

function snapSound(){
  if(navigator.vibrate) navigator.vibrate([10,18,28]);
  if(!soundOn)return;
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A)return;
    const a=new A(),o=a.createOscillator(),g=a.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(190,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(78,a.currentTime+.11);
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.13,a.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);
    o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.14);
  }catch(e){}
}

document.querySelectorAll('.piece').forEach(p=>{
  let dragging=false,sx=0,sy=0,baseX=0,baseY=0;
  const i=Number(p.dataset.i);

  p.addEventListener('pointerdown',e=>{
    if(locked[i])return;
    e.preventDefault();
    dragging=true;
    p.classList.add('drag');
    p.setPointerCapture(e.pointerId);
    const r=p.getBoundingClientRect();
    sx=e.clientX;sy=e.clientY;baseX=r.left;baseY=r.top;
  });

  p.addEventListener('pointermove',e=>{
    if(!dragging)return;
    e.preventDefault();
    const x=baseX+(e.clientX-sx), y=baseY+(e.clientY-sy);
    p.style.position='fixed';
    p.style.left=x+'px';
    p.style.top=y+'px';

    const r=p.getBoundingClientRect(), b=board.getBoundingClientRect();
    const targetX = i===0 ? b.left+b.width*.25 : b.left+b.width*.75;
    const targetY = b.top+b.height*.5;
    const cx=r.left+r.width*.5, cy=r.top+r.height*.5;
    const d=Math.hypot(cx-targetX,cy-targetY);

    if(d<80) statusEl.textContent='……もう少し。';
    if(d<30){
      p.style.left=(targetX-r.width*.5)+'px';
      p.style.top=(targetY-r.height*.5)+'px';
      p.classList.remove('drag');
      p.classList.add('locked');
      locked[i]=true;
      dragging=false;
      snapSound();
      if(locked[0]&&locked[1]) statusEl.textContent='🎉 連結成功！ サクッ！';
      else statusEl.textContent='🧩 もう1ピースもつないでみよう';
    }
  });

  p.addEventListener('pointerup',e=>{
    dragging=false;p.classList.remove('drag');
    try{p.releasePointerCapture(e.pointerId)}catch(_ ){}
  });
  p.addEventListener('pointercancel',()=>{dragging=false;p.classList.remove('drag')});
});

document.getElementById('reset').onclick=()=>location.reload();
document.getElementById('sound').onclick=e=>{
  soundOn=!soundOn;
  e.currentTarget.textContent=soundOn?'🔊 音あり':'🔇 音なし';
};
</script>
