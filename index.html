<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サクッとパズル</title>
<style>
body{margin:0;background:#eee8dc;font-family:sans-serif;text-align:center;color:#333}
h1{font-size:24px;margin:25px 0 8px}
#board{position:relative;width:90vw;max-width:500px;aspect-ratio:1.5;margin:20px auto;background:linear-gradient(#9edcff 0 55%,#75b95c 55%);border:12px solid #b18d5d;border-radius:15px;overflow:hidden;box-shadow:0 8px 18px #0003}
.piece{position:absolute;width:45%;height:45%;border:4px solid white;border-radius:18px;background:#ffffff66;box-shadow:0 5px 10px #0003;font-size:40px;display:flex;align-items:center;justify-content:center;touch-action:none}
#p1{left:3%;top:3%}#p2{right:3%;top:3%}#p3{left:3%;bottom:3%}#p4{right:3%;bottom:3%}
#message{font-size:20px;font-weight:bold;min-height:30px}
</style>
</head>
<body>
<h1>🧩 サクッとパズル</h1>
<p>ピースを動かしてみよう</p>
<div id="board">
<div class="piece" id="p1">🚄</div>
<div class="piece" id="p2">🧩</div>
<div class="piece" id="p3">🧩</div>
<div class="piece" id="p4">🚄</div>
</div>
<div id="message">ピースをつかんで移動してください</div>
<script>
let pieces=document.querySelectorAll(".piece");
let message=document.getElementById("message");
pieces.forEach(piece=>{
let sx,sy;
piece.addEventListener("pointerdown",e=>{
sx=e.clientX;sy=e.clientY;piece.setPointerCapture(e.pointerId);
});
piece.addEventListener("pointermove",e=>{
if(!piece.hasPointerCapture(e.pointerId))return;
let x=e.clientX-sx,y=e.clientY-sy;
piece.style.transform=`translate(${x}px,${y}px)`;
});
piece.addEventListener("pointerup",()=>{
piece.style.transition="transform .15s";
piece.style.transform="scale(1.04)";
if(navigator.vibrate)navigator.vibrate([15,20,35]);
message.textContent="✨ サクッ！";
setTimeout(()=>{piece.style.transform="scale(1)"},180);
});
});
</script>
</body>
</html>
