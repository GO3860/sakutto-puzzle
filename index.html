<path d="M18 321 H393" stroke="#6c7780" stroke-width="6"/><path d="M0 358 Q100 345 200 360 T400 354 V400 H0Z" fill="#4f8e3f"/></g><path d="M0 0H78C78 28 122 28 122 0H200V78C172 78 172 122 200 122V200H122C122 172 78 172 78 200H0V122C28 122 28 78 0 78Z" fill="none" stroke="#b87d47" stroke-width="7"/><path d="M0 0H78C78 28 122 28 122 0H200V78C172 78 172 122 200 122V200H122C122 172 78 172 78 200H0V122C28 122 28 78 0 78Z" fill="none" stroke="#f6d6a0" stroke-width="2"/></svg></div></div><div class="status" id="status">ピースをつかんで動かしてみよう</div><div class="controls"><button class="alt" id="reset">↻ リセット</button><button id="sound">🔊 音あり</button></div><p class="note">近づくと少し重くなり、最後に「サクッ」と吸い込まれます。</p></div><script>const board=document.querySelector('.board'),status=document.querySelector('#status');
let placed=0,soundOn=true;
document.querySelectorAll('.piece').forEach(p=>{
 let sx=0,sy=0,bl=0,bt=0; const i=Number(p.dataset.i);
 p.onpointerdown=e=>{if(p.classList.contains('locked'))return;p.setPointerCapture(e.pointerId);p.classList.add('drag');sx=e.clientX;sy=e.clientY;bl=parseFloat(p.style.left);bt=parseFloat(p.style.top)};
 p.onpointermove=e=>{if(!p.classList.contains('drag'))return;const r=board.getBoundingClientRect();const dx=(e.clientX-sx)/r.width*100,dy=(e.clientY-sy)/r.height*100;let l=bl+dx,t=bt+dy;const tl=6+(i%2)*50,tt=6+Math.floor(i/2)*50,d=Math.hypot(l-tl,t-tt);if(d<15){l=bl+dx*.55;t=bt+dy*.55;status.textContent='……もう少し。'}p.style.left=l+'%';p.style.top=t+'%';if(d<4.2){p.style.left=tl+'%';p.style.top=tt+'%';p.classList.remove('drag');p.classList.add('locked');placed++;snap()}};
 p.onpointerup=()=>p.classList.remove('drag');
});
function snap(){if(navigator.vibrate)navigator.vibrate([10,18,28]);if(soundOn){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(190,a.currentTime);o.frequency.exponentialRampToValueAtTime(80,a.currentTime+.1);g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.12,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}status.textContent=placed===4?'🎉 完成！ サクッ！':'🧩 サクッ！'}
document.querySelector('#reset').onclick=()=>location.reload();
document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音あり':'🔇 音なし'};
