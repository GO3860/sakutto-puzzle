<title>サクッとパズル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#f5eddf;color:#4b2b19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;text-align:center;padding:11px 10px 5px}
.title{font-size:clamp(28px,7vw,36px);font-weight:900;letter-spacing:.02em}
.sub{font-size:clamp(14px,3.7vw,18px);font-weight:700;color:#765d48;margin-top:2px}
.stage{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding-top:6px}
.board{position:relative;width:min(76vw,360px);aspect-ratio:1;padding:14px;border-radius:25px;background:linear-gradient(145deg,#d4a064,#a96e3e);box-shadow:0 9px #704625,0 15px 25px #0003,inset 0 2px #f4d09b;flex:none}
.frame{position:absolute;inset:14px;border-radius:17px;background:#8f603b;padding:8px;box-shadow:inset 0 0 13px #0006}
.target{position:absolute;inset:8px;border-radius:12px;overflow:hidden;background:#c7ab84}
.target svg{width:100%;height:100%;opacity:.17}
.slotgrid{position:absolute;inset:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;pointer-events:none;opacity:.35}
.slot{border:1px dashed #fff8;border-radius:8px}
.tray{flex:0 0 auto;width:min(88vw,420px);display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin:17px auto 0;justify-items:center}
.piece{position:relative;width:min(39vw,165px);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 7px 5px #0004);cursor:grab}
.piece.drag{z-index:50;filter:drop-shadow(0 13px 9px #0005);cursor:grabbing}
.piece.locked{filter:drop-shadow(0 2px 2px #0003)}
.piece svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.bottom{flex:0 0 auto;padding:2px 10px max(5px,env(safe-area-inset-bottom));text-align:center}
.status{height:27px;font-weight:900;font-size:16px}
.controls{display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:24px;padding:10px 21px;font-size:16px;font-weight:900;color:#fff;background:#2d88d8;box-shadow:0 5px #1d5d96}
button.alt{background:#f2a21b;box-shadow:0 5px #bd7510}
.note{font-size:11px;color:#8a735e;margin:6px 0 0}
@media(max-height:720px){.board{width:min(64vh,74vw)}.tray{margin-top:7px;gap:3px 14px}.piece{width:min(32vw,145px)}.note{display:none}header{padding-top:4px}}
</style></head>

<script>
const board=document.getElementById('board'),tray=document.getElementById('tray'),statusEl=document.getElementById('status');
let placed=0,soundOn=true;
function snapSound(){
 if(navigator.vibrate)navigator.vibrate([10,18,28]);
 if(!soundOn)return;
 try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const a=new A(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(190,a.currentTime);o.frequency.exponentialRampToValueAtTime(78,a.currentTime+.11);g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.13,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.14)}catch(e){}
}
document.querySelectorAll('.piece').forEach(p=>{
 let sx=0,sy=0,startL=0,startT=0;
 const i=Number(p.dataset.i);
 p.addEventListener('pointerdown',e=>{
  e.preventDefault();p.setPointerCapture(e.pointerId);p.classList.add('drag');
  const r=p.getBoundingClientRect();sx=e.clientX;sy=e.clientY;startL=r.left;startT=r.top;
 });
 p.addEventListener('pointermove',e=>{
  if(!p.classList.contains('drag'))return;e.preventDefault();
  const br=board.getBoundingClientRect(),dx=e.clientX-sx,dy=e.clientY-sy;
  const r=p.getBoundingClientRect();const x=startL+dx,y=startT+dy;
  p.style.position='fixed';p.style.left=x+'px';p.style.top=y+'px';p.style.width=Math.min(innerWidth*.39,165)+'px';p.style.zIndex=100;
  const pr=p.getBoundingClientRect(),cx=pr.left+pr.width/2,cy=pr.top+pr.height/2;
  const tx=br.left+br.width*(i%2?0.75:0.25),ty=br.top+br.height*(i>1?0.75:0.25);
  const d=Math.hypot(cx-tx,cy-ty);
  if(d<75)statusEl.textContent='……もう少し。';
  if(d<26){p.style.left=(tx-pr.width/2)+'px';p.style.top=(ty-pr.height/2)+'px';p.classList.remove('drag');p.classList.add('locked');p.style.pointerEvents='none';placed++;snapSound();statusEl.textContent=placed===4?'🎉 完成！ サクッ！':'🧩 サクッ！';}
 });
 p.addEventListener('pointerup',()=>p.classList.remove('drag'));
 p.addEventListener('pointercancel',()=>p.classList.remove('drag'));
});
document.getElementById('reset').onclick=()=>location.reload();
document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音あり':'🔇 音なし'};
