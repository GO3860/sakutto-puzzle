<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サクッとパズル 2ピース</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6eddd;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{touch-action:none}.wrap{position:fixed;inset:0;overflow:hidden;padding:38px 18px 20px}
h1{text-align:center;margin:20px 0 8px;color:#4a2d1d;font-size:30px}
p{text-align:center;color:#725d4c;margin:0 0 28px;font-size:17px}
.area{position:relative;height:58vh;min-height:430px}
.piece{position:absolute;width:42vw;max-width:180px;height:180px;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#4a2d1d;filter:drop-shadow(5px 8px 7px rgba(0,0,0,.25))}
.left{left:7%;top:30%;background:linear-gradient(145deg,#7fc0ea,#4f9fd3);clip-path:url(#leftShape)}
.right{right:7%;top:30%;background:#fffdf7;clip-path:url(#rightShape)}
.dragging{filter:drop-shadow(8px 14px 10px rgba(0,0,0,.32));z-index:10}
.label{pointer-events:none}.note{text-align:center;color:#725d4c;font-size:18px;line-height:1.6}
#status{margin-top:14px;text-align:center;font-weight:700;color:#4a2d1d}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<clipPath id="leftShape" clipPathUnits="userSpaceOnUse"><path d="M0 0H200V52 C200 34 214 25 230 25 C246 25 260 37 260 52 C260 67 246 80 230 80 C214 80 200 69 200 52 V180H0Z"/></clipPath>
<clipPath id="rightShape" clipPathUnits="userSpaceOnUse"><path d="M0 0H200V180H0V80 C16 80 30 67 30 52 C30 37 16 25 0 25 V0Z"/></clipPath>
</defs></svg>
<div class="wrap"><h1>🧩 サクッとパズル</h1>
<p>① まずはピースの「凸凹」を作りました</p>
<div class="area"><div id="left" class="piece left"><span class="label">左のピース</span></div>
<div id="right" class="piece right"><span class="label">右のピース</span></div></div>
<div class="note">ピースを指で押さえて、そのまま動かしてください。<br>右の凸と左の凹が同じ形です。</div>
<div id="status">凸凹の形を確認してみてください</div></div>
<script>
(function(){
function makeDraggable(el){let dragging=false,startX=0,startY=0,baseX=0,baseY=0;
el.addEventListener('touchstart',function(e){if(!e.touches[0])return;e.preventDefault();const t=e.touches[0],r=el.getBoundingClientRect();startX=t.clientX;startY=t.clientY;baseX=r.left;baseY=r.top;dragging=true;el.classList.add('dragging');document.getElementById('status').textContent='つかんでいます'},{passive:false});
el.addEventListener('touchmove',function(e){if(!dragging||!e.touches[0])return;e.preventDefault();const t=e.touches[0];el.style.left=(baseX+t.clientX-startX)+'px';el.style.top=(baseY+t.clientY-startY)+'px';el.style.right='auto';document.getElementById('status').textContent='動いています！'},{passive:false});
function end(){if(!dragging)return;dragging=false;el.classList.remove('dragging');document.getElementById('status').textContent='指を離しました'}
el.addEventListener('touchend',end,{passive:false});el.addEventListener('touchcancel',end,{passive:false})}
makeDraggable(document.getElementById('left'));makeDraggable(document.getElementById('right'));
})();
</script></body></html>
