<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#f5eddf;color:#4b2b19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:11px 10px 4px;flex:0 0 auto}
.title{font-size:clamp(28px,7vw,36px);font-weight:900;letter-spacing:.02em}
.sub{font-size:clamp(14px,3.6vw,18px);font-weight:700;color:#765d48;margin-top:2px}
.boardArea{flex:0 0 auto;display:flex;justify-content:center;padding-top:7px}
.board{position:relative;width:min(76vw,350px);aspect-ratio:1;padding:16px;border-radius:26px;background:linear-gradient(145deg,#d4a064,#a86e3d);box-shadow:0 9px 0 #704625,0 16px 25px #0003,inset 0 2px #f4d09b}
.inner{position:absolute;inset:16px;border-radius:18px;background:#c5aa83;box-shadow:inset 0 0 13px #0006;overflow:hidden}
.inner svg{width:100%;height:100%;opacity:.13}
.slotHint{position:absolute;inset:7%;border:2px dashed #fff7;border-radius:12px;opacity:.45}
.pieces{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;align-content:start;justify-items:center;gap:4px 16px;width:min(88vw,400px);margin:18px auto 0}
.piece{width:min(39vw,165px);aspect-ratio:1;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none;z-index:5}
.paper{width:100%;height:100%;position:relative;filter:drop-shadow(0 8px 5px #0005);touch-action:none}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 0 #0000)}
.paper svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.piece.drag{z-index:100}
.piece.drag .paper{filter:drop-shadow(0 14px 9px #0006)}
.piece.locked .paper{filter:drop-shadow(0 2px 2px #0004)}
.bottom{flex:0 0 auto;text-align:center;padding:1px 10px max(5px,env(safe-area-inset-bottom))}
.status{height:27px;font-size:16px;font-weight:900}
.controls{display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:24px;padding:10px 21px;font-size:16px;font-weight:900;color:#fff;background:#2d88d8;box-shadow:0 5px #1d5d96}
button.alt{background:#f2a21b;box-shadow:0 5px #bd7510}
.note{font-size:11px;color:#8a735e;margin:6px 0 0}
@media(max-height:720px){.board{width:min(64vh,74vw)}.pieces{margin-top:6px;gap:1px 10px}.piece{width:min(32vw,145px)}.note{display:none}header{padding-top:4px}}
</style>

<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
let placed = 0, soundOn = true;

function snapSound(){
  if (navigator.vibrate) navigator.vibrate([10,18,28]);
  if (!soundOn) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    const a = new A(), o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(190,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(78,a.currentTime+.11);
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.13,a.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime+.14);
  } catch(e) {}
}

document.querySelectorAll('.piece').forEach(p => {
  let dragging = false, sx=0, sy=0, ox=0, oy=0;
  const i = Number(p.dataset.i);

  p.addEventListener('pointerdown', e => {
    if (p.classList.contains('locked')) return;
    e.preventDefault();
    dragging = true;
    p.classList.add('drag');
    p.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    ox = 0; oy = 0;
  });

  p.addEventListener('pointermove', e => {
    if (!dragging) return;
    e.preventDefault();

    ox = e.clientX - sx;
    oy = e.clientY - sy;
    p.style.transform = `translate(${ox}px, ${oy}px)`;

    const br = board.getBoundingClientRect();
    const pr = p.getBoundingClientRect();
    const targetX = br.left + br.width * ((i % 2) * .5 + .25);
    const targetY = br.top + br.height * (Math.floor(i/2) * .5 + .25);
    const d = Math.hypot(
      pr.left + pr.width/2 - targetX,
      pr.top + pr.height/2 - targetY
    );

    if (d < 85) statusEl.textContent = '……もう少し。';

    if (d < 32) {
      dragging = false;
      p.releasePointerCapture?.(e.pointerId);
      p.style.transform = `translate(${targetX-(pr.left+pr.width/2)}px, ${targetY-(pr.top+pr.height/2)}px)`;
      p.classList.remove('drag');
      p.classList.add('locked');
      p.style.pointerEvents = 'none';
      placed++;
      snapSound();
      statusEl.textContent = placed === 4 ? '🎉 完成！ サクッ！' : '🧩 サクッ！';
    }
  });

  p.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    p.classList.remove('drag');
    try { p.releasePointerCapture(e.pointerId); } catch(_) {}
  });

  p.addEventListener('pointercancel', () => {
    dragging = false;
    p.classList.remove('drag');
  });
});

document.getElementById('reset').onclick = () => location.reload();
document.getElementById('sound').onclick = e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '🔊 音あり' : '🔇 音なし';
};
</script>
