<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>サクッとパズル 動作テスト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6eddd;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body{touch-action:none}
.wrap{position:fixed;inset:0;overflow:hidden;padding:38px 18px 20px}
h1{text-align:center;margin:20px 0 8px;color:#4a2d1d;font-size:30px}
p{text-align:center;color:#725d4c;margin:0 0 28px;font-size:17px}
.area{position:relative;height:58vh;min-height:430px}
.piece{
 position:absolute;width:42vw;max-width:180px;height:180px;
 border:4px solid #9b6b3d;border-radius:8px;
 box-shadow:5px 8px 12px #0003;
 touch-action:none;user-select:none;-webkit-user-select:none;
 display:flex;align-items:center;justify-content:center;
 font-size:22px;font-weight:700;color:#4a2d1d;
}
.left{left:8%;top:30%;background:linear-gradient(#72b8e7,#4f9fd3)}
.right{right:8%;top:30%;background:#fffdf7}
.dragging{box-shadow:8px 14px 20px #0004;z-index:10}
.note{text-align:center;color:#725d4c;font-size:18px;line-height:1.6}
#status{margin-top:14px;font-weight:700;color:#4a2d1d}
</style>
</head>
<body>
<div class="wrap">
<h1>🧩 サクッとパズル</h1>
<p>まずは「動く」ことだけ確認します</p>
<div class="area">
  <div id="left" class="piece left">左のピース</div>
  <div id="right" class="piece right">右のピース</div>
</div>
<div class="note">ピースを指で押さえて、そのまま動かしてください。</div>
<div id="status">待機中</div>
</div>

<script>
(function(){
  function makeDraggable(el){
    let dragging=false, startX=0, startY=0, baseX=0, baseY=0;

    el.addEventListener('touchstart', function(e){
      if(!e.touches || !e.touches[0]) return;
      e.preventDefault();
      const t=e.touches[0];
      const r=el.getBoundingClientRect();
      startX=t.clientX; startY=t.clientY;
      baseX=r.left; baseY=r.top;
      dragging=true; el.classList.add('dragging');
      document.getElementById('status').textContent='指でつかんでいます';
    }, {passive:false});

    el.addEventListener('touchmove', function(e){
      if(!dragging || !e.touches || !e.touches[0]) return;
      e.preventDefault();
      const t=e.touches[0];
      el.style.left=(baseX + t.clientX-startX)+'px';
      el.style.top=(baseY + t.clientY-startY)+'px';
      el.style.right='auto';
      document.getElementById('status').textContent='動いています！';
    }, {passive:false});

    function end(e){
      if(!dragging) return;
      dragging=false; el.classList.remove('dragging');
      document.getElementById('status').textContent='指を離しました';
    }
    el.addEventListener('touchend',end,{passive:false});
    el.addEventListener('touchcancel',end,{passive:false});

    // iPhone以外やテスト用
    el.addEventListener('pointerdown',function(e){
      if(e.pointerType==='touch') return;
      e.preventDefault();
      const r=el.getBoundingClientRect();
      startX=e.clientX; startY=e.clientY; baseX=r.left; baseY=r.top;
      dragging=true; el.classList.add('dragging');
      el.setPointerCapture?.(e.pointerId);
      document.getElementById('status').textContent='つかみました';
    });
    el.addEventListener('pointermove',function(e){
      if(e.pointerType==='touch' || !dragging) return;
      e.preventDefault();
      el.style.left=(baseX + e.clientX-startX)+'px';
      el.style.top=(baseY + e.clientY-startY)+'px';
      el.style.right='auto';
      document.getElementById('status').textContent='動いています！';
    });
    el.addEventListener('pointerup',function(e){
      if(e.pointerType==='touch') return;
      end(e);
    });
  }
  makeDraggable(document.getElementById('left'));
  makeDraggable(document.getElementById('right'));
})();
</script>
</body>
</html>
