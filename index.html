<title>サクッとパズル</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#f5eddf;color:#4b2b19;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;touch-action:none}
.app{height:100dvh;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{flex:0 0 auto;text-align:center;padding:12px 10px 6px}
.title{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(27px,7vw,36px);font-weight:900;letter-spacing:.02em}
.title .puzzle{font-size:.9em;filter:drop-shadow(1px 3px 1px #0003)}
.sub{font-size:clamp(14px,3.8vw,18px);font-weight:700;color:#765d48;margin-top:2px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 10px}
.board{position:relative;width:min(94vw,560px);aspect-ratio:1;flex:0 0 auto;padding:16px;border-radius:26px;background:linear-gradient(145deg,#d6a064,#a86e3d);box-shadow:0 10px 0 #704625,0 16px 26px #0003,inset 0 2px #f4d09b}
.frame{position:absolute;inset:16px;border-radius:18px;background:#91613b;padding:8px;box-shadow:inset 0 0 13px #0006}
.target{position:absolute;inset:8px;border-radius:12px;overflow:hidden;background:#c7ab84}
.target svg{width:100%;height:100%;opacity:.15}
.piece{position:absolute;width:50%;height:50%;z-index:10;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 8px 5px #0005);transition:filter .08s}
.piece.drag{z-index:100;filter:drop-shadow(0 14px 10px #0006)}
.piece.locked{z-index:20;filter:drop-shadow(0 2px 2px #0004)}
.piece svg{display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.bottom{flex:0 0 auto;padding:3px 12px max(10px,env(safe-area-inset-bottom));text-align:center}
.status{height:28px;font-size:17px;font-weight:900}
.controls{display:flex;justify-content:center;gap:10px}
button{border:0;border-radius:24px;padding:11px 20px;font-size:16px;font-weight:900;color:#fff;background:#2d88d8;box-shadow:0 5px #1d5d96;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px #1d5d96}
button.alt{background:#f2a21b;box-shadow:0 5px #bd7510}
.note{font-size:12px;color:#8a735e;margin:7px 0 0}
@media (max-height:700px){header{padding-top:5px}.board{width:min(78vh,92vw)}.note{display:none}.bottom{padding-bottom:4px}}
@media (min-height:701px) and (max-height:820px){.board{width:min(82vh,94vw)}}
</style>

<script>
const board=document.getElementById('board'), statusEl=document.getElementById('status');
let placed=0,soundOn=true;

function snapSound(){
  if(navigator.vibrate) navigator.vibrate([10,18,28]);
  if(!soundOn)return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
    const a=new A(),o=a.createOscillator(),g=a.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(190,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(78,a.currentTime+.11);
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.13,a.currentTime+.008);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);
    o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.14);
  }catch(e){}
}

document.querySelectorAll('.piece').forEach(p=>{
  let sx=0,sy=0,baseL=0,baseT=0;
  const i=Number(p.dataset.i);
  p.addEventListener('pointerdown',e=>{
    if(p.classList.contains('locked'))return;
    e.preventDefault(); p.setPointerCapture(e.pointerId); p.classList.add('drag');
    sx=e.clientX;sy=e.clientY;baseL=parseFloat(p.style.left);baseT=parseFloat(p.style.top);
  });
  p.addEventListener('pointermove',e=>{
    if(!p.classList.contains('drag'))return;
    e.preventDefault();
    const r=board.getBoundingClientRect();
    const dx=(e.clientX-sx)/r.width*100,dy=(e.clientY-sy)/r.height*100;
    let l=baseL+dx,t=baseT+dy;
    const tl=9+(i%2)*40, tt=13+Math.floor(i/2)*38;
    const d=Math.hypot(l-tl,t-tt);
    if(d<13){l=baseL+dx*.55;t=baseT+dy*.55;statusEl.textContent='……もう少し。';}
    p.style.left=l+'%';p.style.top=t+'%';
    if(d<3.8){
      p.style.left=tl+'%';p.style.top=tt+'%';p.classList.remove('drag');p.classList.add('locked');
      placed++;snapSound();statusEl.textContent=placed===4?'🎉 完成！ サクッ！':'🧩 サクッ！';
    }
  });
  p.addEventListener('pointerup',e=>{e.preventDefault();p.classList.remove('drag')});
  p.addEventListener('pointercancel',()=>p.classList.remove('drag'));
});

document.getElementById('reset').onclick=()=>location.reload();
document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音あり':'🔇 音なし'};
</script>
