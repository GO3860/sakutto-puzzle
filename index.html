<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>サクッとパズル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eddf;color:#4a2c1b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;text-align:center}header{padding:28px 12px 12px}h1{font-size:34px;margin:0;font-weight:900}.sub{font-weight:700;color:#705844;margin-top:6px}.game{width:92vw;max-width:520px;margin:auto}.board{position:relative;padding:22px;border-radius:28px;background:linear-gradient(145deg,#d29a61,#a97140);box-shadow:0 12px #7c512f,0 20px 30px #0002}.grid{position:relative;width:100%;aspect-ratio:1;border-radius:18px;background:#c9b28e;box-shadow:inset 0 0 0 7px #6d472b}.slot{position:absolute;width:50%;height:50%;background:#bda581;border-radius:14px;box-shadow:inset 0 0 10px #0004}.piece{position:absolute;width:50%;height:50%;touch-action:none;filter:drop-shadow(0 8px 5px #0004);z-index:5}.card{position:absolute;inset:0;border:6px solid #c38b51;border-radius:14px;background:linear-gradient(#72c4ef 0 52%,#6da74f 52% 72%,#d9b86d 72%);box-shadow:inset 0 -11px #8a6038,inset 0 0 0 2px #f4d59c}.tab{position:absolute;background:#72c4ef;border:6px solid #c38b51}.t{width:54px;height:30px;left:50%;top:-28px;transform:translateX(-50%);border-bottom:0;border-radius:30px 30px 0 0}.b{width:54px;height:30px;left:50%;bottom:-28px;transform:translateX(-50%);border-top:0;border-radius:0 0 30px 30px}.l{width:30px;height:54px;left:-28px;top:50%;transform:translateY(-50%);border-right:0;border-radius:30px 0 0 30px}.r{width:30px;height:54px;right:-28px;top:50%;transform:translateY(-50%);border-left:0;border-radius:0 30px 30px 0}.train{position:absolute;left:4%;right:4%;bottom:10%;height:48%;font-size:clamp(48px,15vw,82px);display:flex;align-items:center;justify-content:center;z-index:3;text-shadow:3px 4px 2px #0004}.track{position:absolute;left:0;right:0;bottom:12%;height:7%;background:repeating-linear-gradient(90deg,#76513d 0 12px,#d2c1a9 12px 19px)}.cloud{position:absolute;top:8%;left:10%;font-size:38px}.status{min-height:30px;margin:24px 0 10px;font-weight:800}.controls{display:flex;gap:10px;justify-content:center}button{border:0;border-radius:24px;padding:14px 24px;background:#2d87d8;color:#fff;font-size:17px;font-weight:900;box-shadow:0 6px #1d5d96}button:active{transform:translateY(4px);box-shadow:0 2px #1d5d96}.hint{margin:18px 15px 30px;color:#8b7560;font-size:14px}
</style>
<body><header><h1>🧩 サクッとパズル</h1><div class="sub">ピースを動かして絵を完成させよう</div></header><main class="game"><div class="board"><div class="grid" id="grid"><i class="slot" style="left:0;top:0"></i><i class="slot" style="left:50%;top:0"></i><i class="slot" style="left:0;top:50%"></i><i class="slot" style="left:50%;top:50%"></i></div></div><div class="status" id="status">ピースをつかんで動かしてみよう</div><div class="controls"><button id="reset">↻ リセット</button><button id="sound">🔊 音あり</button></div><div class="hint">近づくと少し重くなり、最後に「サクッ」とはまります。</div></main>
<script>
const g=document.querySelector("#grid"),s=document.querySelector("#status");let ps=[],n=0,on=true;
function mk(i){let p=document.createElement("div");p.className="piece";p.dataset.i=i;p.innerHTML='<div class="card"><div class="cloud">☁️</div><div class="train">'+(["🚄","🚅","🚄","🚅"][i])+'</div><div class="track"></div><b class="tab t"></b><b class="tab b"></b><b class="tab l"></b><b class="tab r"></b></div>';let st=[[-12,-28],[58,4],[-20,58],[57,55]][i];p.style.left=st[0]+"%";p.style.top=st[1]+"%";g.appendChild(p);ps.push(p);let sx,sy;
p.onpointerdown=e=>{if(p.locked)return;p.setPointerCapture(e.pointerId);p.classList.add("drag");sx=e.clientX;sy=e.clientY};
p.onpointermove=e=>{if(!p.classList.contains("drag"))return;let r=g.getBoundingClientRect(),q=p.getBoundingClientRect(),dx=e.clientX-sx,dy=e.clientY-sy;let tx=r.left+(i%2)*r.width/2,ty=r.top+Math.floor(i/2)*r.height/2,dist=Math.hypot(tx-q.left,ty-q.top);if(dist<80){dx*=.86;dy*=.86;s.textContent="……もう少し。"}p.style.left=(q.left+dx-r.left)/r.width*100+"%";p.style.top=(q.top+dy-r.top)/r.height*100+"%";if(dist<28){p.style.left=(tx-r.left)/r.width*100+"%";p.style.top=(ty-r.top)/r.height*100+"%";p.locked=1;p.classList.remove("drag");n++;if(navigator.vibrate)navigator.vibrate([10,18,28]);beep();s.textContent=n===4?"🎉 完成！ サクッ！":"🧩 サクッ！"}};
p.onpointerup=()=>p.classList.remove("drag")}
function beep(){if(!on)return;try{let a=new AudioContext(),o=a.createOscillator(),v=a.createGain();o.frequency.value=140;v.gain.value=.08;o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.09)}catch(e){}}
function reset(){ps.forEach(x=>x.remove());ps=[];n=0;for(let i=0;i<4;i++)mk(i);s.textContent="ピースをつかんで動かしてみよう"}document.querySelector("#reset").onclick=reset;document.querySelector("#sound").onclick=e=>{on=!on;e.textContent=on?"🔊 音あり":"🔇 音なし"};reset();
</script></body></html>
